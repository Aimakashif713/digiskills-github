```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .signup-box {
            width: 380px;
            padding: 40px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        .signup-box h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #333;
        }

        .signup-box p {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        .input-box {
            margin-bottom: 18px;
        }

        .input-box label {
            display: block;
            margin-bottom: 7px;
            color: #555;
            font-weight: bold;
        }

        .input-box input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .input-box input:focus {
            border-color: #667eea;
        }

        .terms {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            color: #555;
        }

        .terms input {
            width: 15px;
            height: 15px;
        }

        .terms a {
            color: #667eea;
            text-decoration: none;
        }

        .signup-btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .signup-btn:hover {
            background: #5568d9;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #555;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
    </style>

</head>

<body>

    <div class="signup-box">

        <h1>Create Account</h1>

        <p>Sign up to create your account</p>

        <form>

            <!-- Full Name -->
            <div class="input-box">
                <label for="name">Full Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your full name"
                    required
                >
            </div>

            <!-- Email -->
            <div class="input-box">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <!-- Password -->
            <div class="input-box">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    required
                >
            </div>

            <!-- Confirm Password -->
            <div class="input-box">
                <label for="confirm-password">Confirm Password</label>

                <input
                    type="password"
                    id="confirm-password"
                    placeholder="Confirm your password"
                    required
                >
            </div>

            <!-- Terms -->
            <div class="terms">

                <input
                    type="checkbox"
                    id="terms"
                    required
                >

                <label for="terms">
                    I agree to the
                    <a href="#">Terms & Conditions</a>
                </label>

            </div>

            <!-- Sign Up Button -->
            <button
                type="submit"
                class="signup-btn"
            >
                Sign Up
            </button>

        </form>

        <!-- Login Link -->
        <div class="login-link">

            Already have an account?
            <a href="login.html">Login</a>

        </div>

    </div>

</body>

</html>
```
